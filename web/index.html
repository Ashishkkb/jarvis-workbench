<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#182923">
  <meta name="description" content="Jarvis Workbench — your files, Git, and system, in one local workspace.">
  <title>Jarvis — Local workbench</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='13' fill='%23182923'/%3E%3Cpath d='M29 12v19c0 6-12 7-12-1' fill='none' stroke='%239bddbc' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to workspace</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <button class="brand" id="brand-home" aria-label="Jarvis overview">
        <span class="brand-mark" aria-hidden="true">j<span>›</span></span>
        <span class="brand-name">jarvis<span>YOUR LOCAL WORKBENCH</span></span>
      </button>
      <div class="workspace-switch">
        <span class="workspace-avatar" aria-hidden="true">⌘</span>
        <span><strong id="workspace-name">Local workspace</strong><small id="workspace-platform">On your computer</small></span>
        <span class="connection-dot" aria-label="Local connection"></span>
      </div>
      <nav id="nav" class="navigation"></nav>
      <div class="sidebar-bottom">
        <button class="sidebar-link" id="toolbox-button"><span data-icon="sparkles"></span>Explore the toolbox<span class="keycap">?</span></button>
        <button class="sidebar-link" id="support-button"><span data-icon="heart"></span>About & support</button>
        <div class="local-note"><span class="status-dot"></span><span>Local by design.<small>Your workspace stays yours.</small></span><span data-icon="shield"></span></div>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <div class="breadcrumb"><span data-icon="folder"></span><span id="breadcrumb-workspace">Workspace</span><span class="breadcrumb-divider">/</span><strong id="breadcrumb-screen">Overview</strong></div>
        <div class="topbar-actions">
          <button class="command-trigger" id="command-button"><span data-icon="search"></span><span>Find a tool or action…</span><kbd>Ctrl K</kbd></button>
          <span class="local-badge"><span class="status-dot"></span>Local session</span>
          <button class="icon-button mobile-command" id="mobile-command" aria-label="Find a tool"><span data-icon="search"></span></button>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <div id="page" aria-live="polite"><div class="initial-loading"><span class="spinner"></span><p>Opening your workspace…</p></div></div>
      </main>
      <footer class="main-footer"><span><span data-icon="shield"></span> Connected to your computer. No cloud required.</span><span id="footer-version">Jarvis Workbench</span></footer>
    </div>
  </div>
  <div id="job-dock" class="job-dock" hidden aria-live="polite"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="modal" class="modal" aria-labelledby="modal-title"></dialog>
</body>
</html>
